<html data-carbon-theme="white"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
body{margin:0;padding:24px;background:var(--cds-background);color:var(--cds-text-primary);font-family:var(--cds-font-sans)}
.lbl{font-size:.75rem;letter-spacing:.32px;color:var(--cds-text-secondary);margin:0 0 10px}
.row{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start;margin-bottom:24px}
.col{display:flex;flex-direction:column;gap:16px;margin-bottom:24px}
</style></head>
<body><div id="root"></div>
<script type="text/babel">
const { Button, TextInput, TextArea, Select, Search, Dropdown, NumberInput, Checkbox, RadioButton, Toggle, Slider } = window.IBMCarbonDesignSystem_8852ea;
function App(){return <div>
  <p className="lbl">Button — variants</p>
  <div className="row">
    <Button variant="primary">Primary</Button>
    <Button variant="secondary">Secondary</Button>
    <Button variant="tertiary">Tertiary</Button>
    <Button variant="ghost">Ghost</Button>
    <Button variant="danger">Danger</Button>
    <Button variant="primary" disabled>Disabled</Button>
  </div>

  <p className="lbl">Button — sizes (sm 32 · md 40 · lg 48)</p>
  <div className="row">
    <Button size="sm">Small</Button>
    <Button size="md">Medium</Button>
    <Button size="lg">Large</Button>
  </div>

  <p className="lbl">Text fields</p>
  <div className="row">
    <TextInput style={{width:280}} labelText="Email address" placeholder="you@example.com" helperText="We'll never share it." />
    <TextInput style={{width:280}} labelText="API key" invalid invalidText="That key isn't valid." defaultValue="sk-bad" />
    <Select style={{width:220}} labelText="Region" items={['us-south','eu-de','jp-tok']} />
  </div>

  <div className="row">
    <TextArea style={{width:380}} labelText="Description" rows={3} maxCount={200} />
    <Dropdown style={{width:240}} titleText="Instance size" items={['Lite','Standard','Premium']} />
    <NumberInput style={{width:200}} label="Replicas" min={1} max={10} defaultValue={3} />
  </div>

  <p className="lbl">Search</p>
  <div className="row"><Search style={{width:420}} labelText="Search resources" /></div>

  <p className="lbl">Selection controls</p>
  <div className="row" style={{gap:40}}>
    <div style={{display:'flex',flexDirection:'column',gap:10}}>
      <Checkbox labelText="Enable logging" defaultChecked />
      <Checkbox labelText="All regions" indeterminate />
      <Checkbox labelText="Unavailable" disabled />
    </div>
    <div style={{display:'flex',flexDirection:'column',gap:10}}>
      <RadioButton name="plan" value="lite" labelText="Lite" checked onChange={()=>{}} />
      <RadioButton name="plan" value="pro" labelText="Pro" onChange={()=>{}} />
    </div>
    <Toggle labelText="Auto-scaling" defaultToggled />
  </div>

  <p className="lbl">Slider</p>
  <div style={{maxWidth:460}}><Slider labelText="Memory (GB)" min={1} max={64} defaultValue={8} /></div>
</div>;}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
